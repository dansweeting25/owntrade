# Builds the site and deploys it to Cloudflare Workers on every push to main (or by hand from the Actions tab).
# Needs the repository secret CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers" + Account → D1 → Edit).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e624c7016cf48dd0f73213ca13333765
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply database migrations
        run: |
          db=$(node -e "const s=require('fs').readFileSync('wrangler.jsonc','utf8').replace(/^\s*\/\/.*$/mg,'');console.log(JSON.parse(s).d1_databases[0].database_name)")
          npx wrangler d1 migrations apply "$db" --remote
      - run: npx wrangler deploy
